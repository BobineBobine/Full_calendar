<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Calendrier</title>
  <meta name="description" content="Lecteur / éditeur léger des notes Full Calendar d'Obsidian stockées sur OneDrive.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=5">
  <script src="vendor/fullcalendar.min.js"></script>
  <script src="vendor/fc-fr.min.js"></script>
  <script type="module" src="js/app.js?v=5"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-wand" viewBox="0 0 24 24"><path d="m3 21 10-10M15 4V2M15 10V8M11 6H9M21 6h-2M18 3l-1 1M18 9l-1-1M12 3l1 1"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    </defs>
  </svg>

  <header class="appbar">
    <button id="hdrPrev" class="ib sm" aria-label="Période précédente"><svg><use href="#i-left"/></svg></button>
    <button id="hdrTitle" class="title-btn" aria-label="Revenir à aujourd'hui"><span id="hdrTitleText">Calendrier</span></button>
    <button id="hdrNext" class="ib sm" aria-label="Période suivante"><svg><use href="#i-right"/></svg></button>
    <span class="spacer"></span>
    <button id="btnToday" class="ib today-btn" aria-label="Aujourd'hui"><span id="todayNum"></span></button>
    <button id="btnSearch" class="ib" aria-label="Rechercher"><svg><use href="#i-search"/></svg></button>
    <button id="btnSync" class="ib" aria-label="Synchroniser"><svg><use href="#i-sync"/></svg></button>
    <button id="btnMenu" class="ib" aria-label="Calendriers et réglages"><svg><use href="#i-menu"/></svg><span id="menuDot" class="dot" hidden></span></button>
  </header>
  <div id="banner" hidden><span></span><button type="button"></button></div>

  <main id="cal"></main>
  <main id="agenda" hidden></main>
  <div id="status" hidden></div>

  <nav id="viewNav" aria-label="Vue">
    <button data-view="agenda">Agenda</button>
    <button data-view="timeGridDay">Jour</button>
    <button data-view="timeGrid3Day">3 jours</button>
    <button data-view="timeGridWeek">Semaine</button>
    <button data-view="dayGridMonth">Mois</button>
  </nav>
  <button id="fab" type="button" aria-label="Nouvel événement"><svg><use href="#i-plus"/></svg></button>
  <div id="toast" role="status" aria-live="polite"><span></span><button type="button" hidden></button></div>

  <!-- Fiche d'un événement -->
  <dialog id="dlgDetail" class="sheet">
    <div class="sheet-handle"></div>
    <button type="button" class="ib sheet-close" data-close aria-label="Fermer"><svg><use href="#i-x"/></svg></button>
    <div class="dt-cal"><span class="swatch"></span><span id="dtCal"></span></div>
    <h2 id="dtTitle"></h2>
    <div class="dt-meta"><svg><use href="#i-clock"/></svg><span id="dtWhen"></span></div>
    <div class="dt-meta" id="dtRecurRow"><svg><use href="#i-repeat"/></svg><span id="dtRecur"></span></div>
    <div id="dtBody" class="md"></div>
    <div class="dt-actions">
      <button type="button" id="dtEdit" class="primary"><svg><use href="#i-edit"/></svg>Modifier</button>
      <button type="button" id="dtDup"><svg><use href="#i-copy"/></svg>Dupliquer</button>
      <button type="button" id="dtGoto"><svg><use href="#i-target"/></svg>Voir le jour</button>
      <a id="dtObsidian" class="btn"><svg><use href="#i-ext"/></svg>Obsidian</a>
      <button type="button" id="dtDelete" class="danger"><svg><use href="#i-trash"/></svg>Supprimer</button>
    </div>
  </dialog>

  <!-- Éditeur -->
  <dialog id="dlgEvent" class="sheet">
    <form id="evForm" method="dialog">
      <div class="sheet-handle"></div>
      <div class="form-head">
        <button type="button" class="ib" id="evCancel" aria-label="Annuler"><svg><use href="#i-x"/></svg></button>
        <h2 id="evTitleHead">Événement</h2>
        <button type="submit" id="evSave" class="primary">Enregistrer</button>
      </div>
      <p id="evWarn" class="warn" hidden>Règle de récurrence avancée (rrule) : seule la première occurrence est affichée.</p>

      <input id="evTitle" class="title-input" required autocomplete="off" enterkeyhint="done" placeholder="Titre — ex. « Dîner Alex demain 20h »">
      <div id="quickHint" class="quick-hint" hidden>
        <svg><use href="#i-wand"/></svg><span></span>
        <button type="button" id="quickApply">Appliquer</button>
      </div>

      <label class="field cal-field"><span>Calendrier</span>
        <select id="evCal"></select>
      </label>

      <div class="toggles">
        <label class="switch"><input type="checkbox" id="evAllDay" role="switch"><span class="track"></span> Toute la journée</label>
        <label class="switch"><input type="checkbox" id="evRecurring" role="switch"><span class="track"></span> Récurrent</label>
      </div>

      <div id="rowSingle" class="grid2">
        <label class="field"><span>Date</span><input type="date" id="evDate"></label>
        <label class="field"><span>Jusqu'au (facultatif)</span><input type="date" id="evEndDate"></label>
      </div>

      <div id="rowRecur" hidden>
        <div class="field"><span>Jours</span><div id="evDays" class="chips"></div></div>
        <div class="grid2">
          <label class="field"><span>À partir du</span><input type="date" id="evStartRecur"></label>
          <label class="field"><span>Jusqu'au (facultatif)</span><input type="date" id="evEndRecur"></label>
        </div>
      </div>

      <div id="rowTimes" class="grid2">
        <label class="field"><span>Début</span><input type="time" id="evStart"></label>
        <label class="field"><span>Fin</span><input type="time" id="evEnd"></label>
      </div>

      <label class="field"><span>Notes</span>
        <textarea id="evBody" rows="5" placeholder="Contenu de la note (Markdown, facultatif)"></textarea>
      </label>
    </form>
  </dialog>

  <!-- Confirmation -->
  <dialog id="dlgConfirm" class="sheet confirm">
    <div class="sheet-handle"></div>
    <h2 id="cfTitle"></h2>
    <p id="cfMsg"></p>
    <div class="cf-actions">
      <button type="button" id="cfNo">Annuler</button>
      <button type="button" id="cfYes" class="primary">OK</button>
    </div>
  </dialog>

  <!-- Recherche -->
  <dialog id="dlgSearch" class="fullscreen">
    <div class="search-bar">
      <button type="button" class="ib" data-close aria-label="Fermer"><svg><use href="#i-left"/></svg></button>
      <input id="searchInput" type="search" placeholder="Rechercher un événement, une note…" enterkeyhint="search" autocomplete="off">
    </div>
    <div id="searchResults"></div>
  </dialog>

  <!-- Menu : calendriers + réglages -->
  <dialog id="dlgMenu" class="sheet">
    <div class="sheet-handle"></div>
    <button type="button" class="ib sheet-close" data-close aria-label="Fermer"><svg><use href="#i-x"/></svg></button>
    <h2>Calendriers</h2>
    <div id="menuCals"></div>
    <p id="menuSync" class="hint"></p>
    <div class="row">
      <button type="button" id="menuSettings"><svg><use href="#i-gear"/></svg>Réglages</button>
      <span class="spacer"></span>
      <button type="button" id="menuSyncBtn" class="primary"><svg><use href="#i-sync"/></svg>Synchroniser</button>
    </div>
  </dialog>

  <!-- Réglages -->
  <dialog id="dlgSettings" class="sheet tall">
    <form id="setForm" method="dialog">
      <div class="sheet-handle"></div>
      <div class="form-head">
        <button type="button" class="ib" id="setCancel" aria-label="Annuler"><svg><use href="#i-x"/></svg></button>
        <h2>Réglages</h2>
        <button type="submit" class="primary">Enregistrer</button>
      </div>

      <section>
        <h3>1. Application Microsoft</h3>
        <label class="field"><span>ID d'application (client)</span>
          <input id="setClientId" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
        </label>
        <p class="hint">URI de redirection à déclarer (type « Application monopage / SPA ») :<br><code id="setRedirect"></code></p>
      </section>

      <section>
        <h3>2. Connexion OneDrive</h3>
        <div class="row">
          <span id="setAuthState"></span>
          <span class="spacer"></span>
          <button type="button" id="setLogin" class="primary">Se connecter</button>
          <button type="button" id="setLogout">Se déconnecter</button>
        </div>
      </section>

      <section id="setVaultBox">
        <h3>3. Coffre Obsidian</h3>
        <label class="field"><span>Chemin du coffre dans OneDrive</span>
          <input id="setVault" list="vaultList" autocomplete="off" spellcheck="false" placeholder="ex. Documents/MonCoffre">
          <datalist id="vaultList"></datalist>
        </label>
        <div class="row wrap">
          <button type="button" id="setDetect">Chercher mes coffres</button>
          <button type="button" id="setImport" class="primary">Importer la config Full Calendar</button>
        </div>

        <h3>Calendriers</h3>
        <div id="setSources"></div>
        <button type="button" id="setAddSrc">+ Ajouter un calendrier</button>

        <div class="grid2">
          <label class="field"><span>Vue par défaut</span>
            <select id="setView">
              <option value="agenda">Agenda</option>
              <option value="timeGridDay">Jour</option>
              <option value="timeGrid3Day">3 jours</option>
              <option value="timeGridWeek">Semaine</option>
              <option value="dayGridMonth">Mois</option>
            </select>
          </label>
          <label class="field"><span>Début de semaine</span>
            <select id="setFirstDay">
              <option value="1">Lundi</option>
              <option value="0">Dimanche</option>
              <option value="6">Samedi</option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <button type="button" id="setClearCache">Vider le cache local</button>
      </section>
    </form>
  </dialog>
</body>
</html>
